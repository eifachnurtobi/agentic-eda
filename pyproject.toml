[project]
name = "eda-lite"
version = "0.1.0"
description = "Lean, hackable agentic EDA: prompts as files, patterns as functions, every run traced and graded"
requires-python = ">=3.12"
dependencies = [
    "nbformat>=5.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
eda-lite = "eda_lite.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2.2"]  # pandas: projects/*/evaluation_spec/reference_analysis.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: needs a running Docker daemon with Compose"]

[tool.ruff]
line-length = 100
# Run folders hold generated code as evidence; prompts/ holds templates, not modules.
extend-exclude = ["runs", "runs-*", "src/eda_lite/prompts"]
